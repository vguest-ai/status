# vGuest public status page - https://github.com/vguest-ai/status
owner: vguest-ai
repo: status

sites:
  - name: Website
    url: https://vguest.ai
  - name: API
    url: https://api.vguest.ai/health
  - name: Staff dashboard
    url: https://dashboard.vguest.ai
    expectedStatusCodes: [200, 301, 302, 307, 308]
  - name: Guest app
    url: https://my.vguest.ai
    expectedStatusCodes: [200, 301, 302, 307, 308]

status-website:
  # Switch to `cname: status.vguest.ai` once the Cloudflare CNAME points at vguest-ai.github.io
  baseUrl: /status
  logoUrl: https://vguest.ai/favicon.ico
  name: vGuest Status
  introTitle: "**vGuest** service status"
  introMessage: Live availability and response time of the vGuest guest-messaging platform, checked every 5 minutes. Incidents are posted here as they happen.
  navbar:
    - title: Status
      href: /
    - title: vguest.ai
      href: https://vguest.ai

# Checks run every 5 minutes; incidents open a GitHub issue automatically.
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  graphs: "0 0 * * *"
